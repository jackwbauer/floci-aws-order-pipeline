services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
      - "4510-4519:4510-4519"     # RDS proxy port range
    environment:
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "4510"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "4519"
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: "postgres:16"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_floci/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    build: .
    command: ["python", "-m", "infra.bootstrap"]
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    depends_on:
      floci:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  invoice-worker:
    build: .
    command: ["python", "-m", "order_pipeline.workers.invoice_worker"]
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  reporting-worker:
    build: .
    command: ["python", "-m", "order_pipeline.workers.reporting_worker"]
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
      DATABASE_URL: postgresql://floci:floci@postgres:5432/reporting
    depends_on:
      bootstrap:
        condition: service_completed_successfully
